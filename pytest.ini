[pytest]
testpaths = tests neighbor_drill
python_files = test_*.py
addopts = -q --strict-markers
markers =
    integration: needs a live service (Hasura, Docker VEP, BLAT, or the network). Opt in with -m integration.
    full: runs against the complete 329k-variant dataset. Slow; opt in with -m full.
    known_defect: pins behaviour that is known to be wrong but is preserved for paper reproducibility.
