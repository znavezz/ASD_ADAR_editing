services:
  postgres:
    image: postgres:16
    container_name: ${POSTGRES_DOCKER_CONTAINER}
    restart: unless-stopped
    user: "${USER_ID}:${GROUP_ID}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${SERVER_HOST}:${POSTGRES_PORT}:5432"
    volumes:
      - ${DB_DIR}:/db
      - ${DB_DIR}/postgres:/var/lib/postgresql/data
      - ${DB_DIR}:/csv:ro


  hasura:
    image: hasura/graphql-engine:v2.40.0
    container_name: ${HASURA_DOCKER_CONTAINER}
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      # Reuse variables to dynamically build the URL
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
    ports:
      - "${SERVER_HOST}:${GRAPHQL_PORT}:8080"
    user: "${USER_ID}:${GROUP_ID}"
